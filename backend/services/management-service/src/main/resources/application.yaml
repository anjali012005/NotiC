server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: management-service

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notifyflow}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:${RABBITMQ_HOST:localhost}}
    port: ${SPRING_RABBITMQ_PORT:${RABBITMQ_PORT:5672}}
    username: ${SPRING_RABBITMQ_USERNAME:${RABBITMQ_USERNAME:}}
    password: ${SPRING_RABBITMQ_PASSWORD:${RABBITMQ_PASSWORD:}}
    connection-timeout: ${RABBITMQ_CONNECTION_TIMEOUT:5s}
    listener:
      simple:
        prefetch: ${RABBITMQ_PREFETCH:1}
        shutdown-timeout: ${RABBITMQ_SHUTDOWN_TIMEOUT:30s}
        missing-queues-fatal: false

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    baseline-on-migrate: true
    baseline-version: 15

  lifecycle:
    timeout-per-shutdown-phase: ${SPRING_LIFECYCLE_TIMEOUT:30s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,rabbit
  prometheus:
    metrics:
      export:
        enabled: true

notifyflow:
  security:
    enabled: ${NOTIFYFLOW_SECURITY_ENABLED:true}
    api-keys: {}

notification:
  max-retry-count: 3
  retry:
    max-attempts: 3
    delays:
      - 5s
      - 30s
      - 2m
  worker:
    fixed-delay-ms: 5000
    batch-size: 20
    processing-timeout-minutes: 10
  providers:
    default:
      rate-limit:
        requests-per-second: 20
        burst: 10
      circuit-breaker:
        failure-threshold: 5
        open-duration-ms: 30000
        half-open-max-calls: 2
    sendgrid:
      # Override with SENDGRID_BASE_URL for a local HTTP stub; keep credentials out of this file.
      base-url: ${SENDGRID_BASE_URL:https://api.sendgrid.com/v3/mail/send}
      rate-limit:
        requests-per-second: 10
        burst: 5
      circuit-breaker:
        failure-threshold: 3
        open-duration-ms: 30000
        half-open-max-calls: 2
  rabbitmq:
    exchange: notifyflow.notifications
    queue: notifyflow.notification-created
    routing-key: notification.created
    retry-exchange: notifyflow.retry
    retry-queue-5s: notification.retry.5s
    retry-queue-30s: notification.retry.30s
    retry-queue-2m: notification.retry.2m
    dlx: notifyflow.dlx
    dlq-queue: notification.dlq
    reconciliation-delay-ms: 60000
  outbox:
    fixed-delay-ms: 5000
    batch-size: 20
    max-attempts: 10
