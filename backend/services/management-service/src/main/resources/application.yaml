server:
  port: 8081

spring:
  application:
    name: management-service

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/notifyflow
    username: postgres
    password: admin

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

notification:
  max-retry-count: 3
  worker:
    fixed-delay-ms: 5000
    batch-size: 20
    processing-timeout-minutes: 10
  providers:
    sendgrid:
      # Override with SENDGRID_BASE_URL for a local HTTP stub; keep credentials out of this file.
      base-url: ${SENDGRID_BASE_URL:https://api.sendgrid.com/v3/mail/send}
  rabbitmq:
    exchange: notifyflow.notifications
    queue: notifyflow.notification-created
    routing-key: notification.created
    reconciliation-delay-ms: 60000
