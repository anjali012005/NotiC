server:
  port: 8081

spring:
  application:
    name: management-service

  datasource:
    url: jdbc:postgresql://localhost:5432/notifyflow
    username: postgres
    password: admin

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info