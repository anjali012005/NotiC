server:
  port: 8081

spring:
  application:
    name: management-service

  config:
    import: optional:file:../../.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/notifyflow
    username: postgres
    password: admin

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

notification:
  max-retry-count: 3
  providers:
    sendgrid:
      # Override with SENDGRID_BASE_URL for a local HTTP stub; keep credentials out of this file.
      base-url: ${SENDGRID_BASE_URL:https://api.sendgrid.com/v3/mail/send}
