server:
  port: 8081

spring:
  application:
    name: management-service

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/notifyflow
    username: postgres
    password: admin

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

notification:
  max-retry-count: 3
  retry:
    max-attempts: 3
    delays:
      - 5s
      - 30s
      - 2m
  worker:
    fixed-delay-ms: 5000
    batch-size: 20
    processing-timeout-minutes: 10
  providers:
    default:
      rate-limit:
        requests-per-second: 20
        burst: 10
      circuit-breaker:
        failure-threshold: 5
        open-duration-ms: 30000
        half-open-max-calls: 2
    sendgrid:
      # Override with SENDGRID_BASE_URL for a local HTTP stub; keep credentials out of this file.
      base-url: ${SENDGRID_BASE_URL:https://api.sendgrid.com/v3/mail/send}
      rate-limit:
        requests-per-second: 10
        burst: 5
      circuit-breaker:
        failure-threshold: 3
        open-duration-ms: 30000
        half-open-max-calls: 2
  rabbitmq:
    exchange: notifyflow.notifications
    queue: notifyflow.notification-created
    routing-key: notification.created
    retry-exchange: notifyflow.retry
    retry-queue-5s: notification.retry.5s
    retry-queue-30s: notification.retry.30s
    retry-queue-2m: notification.retry.2m
    dlx: notifyflow.dlx
    dlq-queue: notification.dlq
    reconciliation-delay-ms: 60000
  outbox:
    fixed-delay-ms: 5000
    batch-size: 20
    max-attempts: 10
